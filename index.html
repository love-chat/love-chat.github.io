<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5}
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.header h2{color:#ff3b5c}
.tabs{display:flex;background:#fff;margin-bottom:8px}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{border-color:#ff3b5c;color:#ff3b5c;font-weight:bold}
.list{padding:8px}
.card{background:#fff;border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer}
.card img{width:60px;height:60px;border-radius:50%;object-fit:cover}
.card .info{flex:1}
.card .name{font-weight:bold}
.card .meta{font-size:12px;color:#888}
.online{width:10px;height:10px;background:#2ecc71;border-radius:50%;display:inline-block}
.badge{background:#ff3b5c;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
#chatView{display:none;flex-direction:column;height:100vh}
.chat-header{background:#fff;padding:10px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#e5ddd5}
.msg{max-width:75%;padding:8px 12px;border-radius:18px;font-size:14px}
.me{background:#0084ff;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.other{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.input-bar{background:#fff;padding:8px;display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid #ddd;outline:none}
.input-bar button{background:#0084ff;color:#fff;border:none;padding:10px 16px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>

<div id="homeView">
  <div class="header"><h2>Love Chat ❤️</h2><span id="myName"></span></div>
  <div class="tabs">
    <div class="tab active" onclick="showTab(1)">1: الدردشة</div>
    <div class="tab" onclick="showTab(2)">2: الأشخاص القريب</div>
  </div>
  <div id="tab1" class="list"></div>
  <div id="tab2" class="list" style="display:none"></
